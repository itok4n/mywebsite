      <h2><a href="../../index.html">ノート</a> / <a href="../index.html">物理学</a> / 宇宙物理学</h2>
      <p>
        宇宙物理学に関するノートの一覧．
        PDFファイルはサイト直下の <code>pdfs/</code> ディレクトリに置き，ここからリンクする．
      </p>

      <input type="text" class="filter-box" id="filter"
             placeholder="タイトル・タグ・メモで絞り込み…">

      <!-- ==============================================
           ノートの追加方法：
           下のテンプレートをコピーして <ul> の先頭に貼り付け，
           内容を書き換える（新しいものほど上に置く）．

           ▼ テンプレート ▼
      <li>
        <div class="entry-title">
          <a href="../../../pdfs/ファイル名.pdf">ノートのタイトル</a>
        </div>
        <div class="entry-meta">
          作成年など．
          <span class="tag">タグ1</span><span class="tag">タグ2</span>
        </div>
        <div class="entry-note">
          内容の要約や学んだことのメモをここに書く．
        </div>
      </li>
           ============================================== -->

      <ul class="entry-list" id="entry-list">
        <!-- まだノートがない．追加するときは上のテンプレートをコピーする． -->
      </ul>

    </main>
  </div>

  <script>
    // 入力に応じてリストを絞り込む（タイトル・メタ情報・メモの全文が対象）
    document.getElementById('filter').addEventListener('input', function () {
      var query = this.value.toLowerCase();
      document.querySelectorAll('#entry-list > li').forEach(function (li) {
        li.style.display = li.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    });
  </script>
